[[patch]]
file = "0001-netcode-server-port-zero-public-address.patch"
sha256 = "6a080d225588f899687f517e03d3985bc9b8f6f1f82dcf9d2c2bfb7326149278"
applies_to = "netcode/netcode.c"
approved = "2026-11-18, campaign director (issue #2 audit, #4)"
reason = "netcode_server_create_dual stores the requested address as the server's public address. Asked for port 0, the socket binds an ephemeral port but server->address keeps port 0, so the connect-token server-address whitelist rejects every token naming the real port. dream-net and l3i bind port 0. After the sockets are bound, a public address (address or address2) whose port is 0 takes its socket's bound port. The client needs no change: netcode_client_get_port already reads the bound socket and the client never checks its own address against a token."

[[patch]]
file = "0002-netcode-windows-exclusive-address-use.patch"
sha256 = "34b65c1dfe4248a3edfa5e00a84d996aaecaadf1a868418720141e4ce6cda382"
applies_to = "netcode/netcode.c"
approved = "2026-11-19, project owner"
reason = "netcode_socket_create binds without SO_EXCLUSIVEADDRUSE on Windows, where by default another socket may bind the same UDP port on a more specific address, before or after netcode's, and then receives every datagram sent to that address: a server bound to 0.0.0.0:<port> silently loses the traffic for 127.0.0.1 or a LAN address to whichever program binds it. Linux and macOS refuse both binds. The patch sets SO_EXCLUSIVEADDRUSE before bind on Windows, for client and server sockets, so either bind fails with WSAEADDRINUSE; a setsockopt failure is a new socket error (12), reported as a socket-creation failure with the OS error. Reported upstream: https://github.com/mas-bandwidth/netcode/issues/227."

[[patch]]
file = "0003-netcode-windows-keep-socket-error.patch"
sha256 = "f38d23e9be69242c3ff75f0b570e71f8734c9a45e324a17a0d617f6a6da6ecf4"
applies_to = "netcode/netcode.c"
approved = "2026-11-19, project owner"
reason = "Every failure path in netcode_socket_create calls netcode_socket_destroy before returning, and on Windows a successful closesocket resets the thread's last error, so the caller could no longer read why the socket failed: a client bind on a taken port reached Rust as an error with no cause. On Unix close leaves errno alone. netcode_socket_destroy now saves WSAGetLastError around closesocket and restores it. Reported upstream: https://github.com/mas-bandwidth/netcode/issues/227."
