name: dream-net CI

on:
  workflow_dispatch:
  pull_request:
  push:
    # Keep branch pushes restricted to main. Non-tag pushes publish to the shared
    # "development" release, so feature branches would compete for the same release.
    branches: main
    tags: ['*']

jobs:
  build:
    permissions:
      actions: write
      contents: write
      pages: write
      id-token: write
    uses: DreamWeave-MP/StroggForge/.github/workflows/libGlobalBuild.yml@v55
    secrets: inherit
    with:
      # Both published crates, dependencies first. With cargo_publish_workspace the publish job
      # ignores this order and walks the workspace itself (dream-net-native, then dream-net),
      # skipping versions crates.io already has and waiting for each to reach the index; the
      # lint job's dry run becomes `cargo publish --workspace --dry-run`, which packages
      # dream-net against the unpublished dream-net-native. Per-crate dry runs cannot: dream-net
      # pins dream-net-native exactly, and crates.io does not have it until both are released.
      crate_names: '["dream-net-native", "dream-net"]'
      cargo_publish_workspace: true
      # rust-version from Cargo.toml (1.88: let chains)
      msrv: auto
      # Criterion benches: wire codec, per-call costs, lossy links, 256-peer scale, and
      # real loopback netcode against a one-datagram-per-event baseline
      generate_benchmarks: true
      # StroggForge records each version crates.io has in content/home/mod.lock and deploys this
      # site, in place of the rustdoc Pages.
      mod_template: true
