[package]
name = "dream-net"
version = "1.0.1"
description = "Networking substrate for DreamWeave: secure UDP, reliable-ordered and unreliable event channels, and schema handshakes over the Más Bandwidth netcode, reliable, and serialize crates"
authors = ["Dave Corley (S3kshun8) <corleycomputerrepair@protonmail.ch>"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/DreamWeave-MP/dream-net"
documentation = "https://dreamweave-mp.github.io/dream-net/"
readme = "README.md"
keywords = ["networking", "udp", "netcode", "gamedev", "multiplayer"]
categories = ["network-programming", "game-development"]
# an allowlist, so nothing that happens to sit in the checkout ships by accident
include = [
    "/src/**",
    "/tests/**",
    "/benches/**",
    "/Cargo.toml",
    "/README.md",
    "/NOTICE.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[dependencies]
# The Más Bandwidth Rust ports, pinned exactly: they define wire compatibility, so an upgrade
# is a deliberate commit that reruns the golden, fuzz and soak suites.
netcode = { package = "netcode-official", version = "=1.0.0" }
reliable = { version = "=1.3.4" }
serialize = { package = "serialize-official", version = "=2.4.0" }
# The schema fingerprint: SHA-256 truncated to 128 bits, so a peer cannot cheaply craft a
# different schema that fingerprints the same. Any 0.11 computes the same digest.
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.11"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# bit-packing and table indexing cast between widths whose bounds the schema and transport
# validation already enforce, the same policy serialize itself uses
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

[[bench]]
name = "wire"
harness = false

[[bench]]
name = "connection"
harness = false

[[bench]]
name = "scale"
harness = false

[[bench]]
name = "netcode"
harness = false
