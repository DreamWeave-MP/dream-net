[package]
name = "dream-net"
version = "1.1.1"
description = "Networking substrate for DreamWeave: secure UDP, reliable-ordered and unreliable event channels, and schema handshakes over Más Bandwidth's netcode and reliable"
authors = ["Dave Corley (S3kshun8) <corleycomputerrepair@protonmail.ch>"]
# dream-net's own code (its Rust, the C shim in native/csrc/, its scripts) is MIT OR Apache-2.0.
# The package also contains and compiles the vendored C in native/vendor/: netcode and reliable
# are BSD-3-Clause, the libsodium subset netcode bundles is ISC (its public-domain ChaCha20
# reference code has no terms or identifier of its own). NOTICE.md carries every notice and
# native/LICENSES.md the per-file inventory; tools/check-native-licenses pins this expression.
license = "(MIT OR Apache-2.0) AND BSD-3-Clause AND ISC"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/DreamWeave-MP/dream-net"
documentation = "https://dreamweave-mp.github.io/dream-net/"
readme = "README.md"
keywords = ["networking", "udp", "netcode", "gamedev", "multiplayer"]
categories = ["network-programming", "game-development"]
# Compiles the vendored C in native/ into one static archive (native/BUILD.md).
build = "build.rs"
# One native archive per build graph: two dream-net versions that both contain the C would define
# the same dn_native_* symbols and collide at link time, so Cargo refuses the pair up front
# instead. The name is the archive's (libdream_net_native.a), and the build script's metadata
# reaches dependents as DEP_DREAM_NET_NATIVE_*, as before the C moved into this package.
links = "dream_net_native"
# An allowlist: the packaged crate must build and pass `cargo test` offline from exactly these
# files (tools/check-offline-consumer), and nothing else that sits in the checkout ships by
# accident: not interop/, fuzz/, the site, docs/ or tools/.
include = [
    "/Cargo.toml",
    "/build.rs",
    "/src/**",
    "/tests/**",
    "/benches/**",
    "/examples/**",
    "/native/csrc/**",
    "/native/vendor/**",
    "/native/patches/**",
    "/native/tools/**",
    "/native/README.md",
    "/native/BUILD.md",
    "/native/LICENSES.md",
    "/native/SODIUM.md",
    "/README.md",
    "/NOTICE.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[workspace]
# One package. interop/ and fuzz/ are separate, unpublished workspaces of their own.
exclude = ["fuzz", "interop"]

[dependencies]
# The schema fingerprint: SHA-256 truncated to 128 bits, so a peer cannot cheaply craft a
# different schema that fingerprints the same. Any 0.11 computes the same digest.
sha2 = { version = "0.11.1", default-features = false }

[build-dependencies]
# The compiler driver only: build.rs picks and verifies the compiler and archiver itself, so
# cc's own detection never chooses one, and checks the final command line. A semver floor, not
# an exact pin: a library must not force its consumers' lockfiles (l3i had 1.9.0 locked).
# 1.2.8 is the oldest release with every API build.rs calls (`Tool::is_like_clang_cl`), and the
# tests pass on it; on Linux 1.2.8 through 1.11.2 compile byte-identical objects. The committed
# Cargo.lock fixes the version our own builds and CI use.
cc = "1.2.8"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# Property tests, among them hostile datagrams and structured mutations into the reliable
# binding's receive_packet, and configs accepted by Config::validate against the C.
proptest = "1.12"

# CI passes -W clippy::pedantic on the command line, which overrides the clippy levels below, so
# src/lib.rs, src/native/mod.rs and each test, bench and example root repeat what they need as
# inner attributes. `unsafe_code` is denied here and in src/lib.rs, allowed only for the
# `native` module (the FFI bindings), and forbidden in every other module's own file.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"
module_name_repetitions = "allow"
# bit-packing and table indexing cast between widths whose bounds the schema and transport
# validation already enforce, the same policy serialize itself uses
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

[[bench]]
name = "wire"
harness = false

[[bench]]
name = "connection"
harness = false

[[bench]]
name = "scale"
harness = false

[[bench]]
name = "netcode"
harness = false
