[package]
name = "dream-net"
version = "0.1.0"
description = "Networking substrate for DreamWeave: secure UDP, reliable-ordered and unreliable event channels, and schema handshakes over the Más Bandwidth netcode, reliable, and serialize crates"
authors = ["Dave Corley (S3kshun8) <corleycomputerrepair@protonmail.ch>"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.88"
keywords = ["networking", "udp", "netcode", "gamedev", "luau"]
categories = ["network-programming", "game-development"]
exclude = ["/fuzz"]

[dependencies]
# The Más Bandwidth Rust ports, pinned exactly: they define wire compatibility, so an upgrade
# is a deliberate commit that reruns the golden, fuzz and soak suites.
netcode = { package = "netcode-official", version = "=1.0.0" }
reliable = { version = "=1.3.4" }
serialize = { package = "serialize-official", version = "=2.4.0" }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.11"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# bit-packing and table indexing cast between widths whose bounds the schema and transport
# validation already enforce, the same policy serialize itself uses
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
